openapi: 3.0.3
info:
  title: Collection Search API
  version: 1.0.0
  description: |
    Keyword search over a sample of the National Museum of Australia's collection, indexed in
    Amazon OpenSearch Service. This API was developed using the National Museum of Australia's
    Collection API. Collection metadata is licensed CC BY-NC 4.0; every result links back to the
    record on the Museum's website. Not affiliated with the National Museum of Australia.

    API Gateway is created from this file (infra/lib/api-stack.ts). Integrations are added there,
    so this file stays a plain, portable contract.

x-amazon-apigateway-api-key-source: HEADER

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check (no API key, no backend)
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /ask:
    post:
      operationId: askCollection
      summary: Ask a question about the collection (RAG with citations)
      description: |
        Retrieves relevant collection records from the Bedrock Knowledge Base and has a model
        answer from them only, with citations. A Bedrock Guardrail checks the question and the
        answer. Needs a signed-in user's access token with the `ask` scope, and the API key.
      security:
        - cognito: [collection-search/ask]
          apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: An answer, or the guardrail's message if the question or answer was blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Throttled

  /favourites:
    get:
      operationId: listFavourites
      summary: The signed-in user's favourite objects, newest first
      security:
        - cognito: [collection-search/favourites]
          apiKey: []
      responses:
        "200":
          description: The user's favourites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavouritesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /favourites/{objectId}:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    put:
      operationId: addFavourite
      summary: Add an object to the signed-in user's favourites (repeating it is harmless)
      security:
        - cognito: [collection-search/favourites]
          apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavouriteRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favourite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: removeFavourite
      summary: Remove an object from the signed-in user's favourites (removing a missing one is harmless)
      security:
        - cognito: [collection-search/favourites]
          apiKey: []
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /search:
    get:
      operationId: searchObjects
      summary: Search collection objects, with facets
      security:
        - apiKey: []
      parameters:
        - name: q
          in: query
          description: Free-text query. Omit to browse everything.
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          description: Filter by object type (exact value from the `types` facet).
          schema: { type: string, maxLength: 200 }
        - name: place
          in: query
          description: Filter by place (exact value from the `places` facet).
          schema: { type: string, maxLength: 200 }
        - name: yearFrom
          in: query
          description: Only dated objects whose date range overlaps [yearFrom, yearTo].
          schema: { type: integer, minimum: 0, maximum: 2100 }
        - name: yearTo
          in: query
          schema: { type: integer, minimum: 0, maximum: 2100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching objects and facet counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Missing or invalid API key
        "429":
          description: Throttled (stage limit or usage plan quota)

components:
  securitySchemes:
    # A Cognito access token ("Authorization: <token>"). API Gateway's form: an apiKey-type
    # scheme with scopes in the requirement. The user pool is added in infra/lib/api-stack.ts.
    cognito:
      type: apiKey
      in: header
      name: Authorization
      x-amazon-apigateway-authtype: cognito_user_pools
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    ObjectId:
      name: objectId
      in: path
      required: true
      description: The Museum's object ID (digits only)
      schema: { type: string, pattern: "^[0-9]{1,12}$" }

  responses:
    Unauthorized:
      description: >-
        Missing, expired or invalid access token, or a valid one without the operation's scope
        (API Gateway checks the token before the API key, so this also wins when both are missing)
    Forbidden:
      description: Valid token, but a missing or invalid API key
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    AskRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 3, maxLength: 500 }

    AskResponse:
      type: object
      required: [answer, citations, guardrailAction, attribution]
      properties:
        answer: { type: string }
        citations:
          type: array
          description: The collection objects the answer is based on, one per object
          items:
            type: object
            required: [objectId, title, sourceUrl]
            properties:
              objectId: { type: string }
              title: { type: string }
              sourceUrl: { type: string, description: The record on the Museum's website }
        guardrailAction:
          type: string
          enum: [NONE, INTERVENED]
          description: INTERVENED when the guardrail blocked the question or the answer
        attribution: { type: string }

    FavouriteRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }

    Favourite:
      type: object
      required: [objectId, title, addedAt]
      properties:
        objectId: { type: string }
        title: { type: string }
        addedAt: { type: string, format: date-time }

    FavouritesResponse:
      type: object
      required: [favourites]
      properties:
        favourites:
          type: array
          items:
            $ref: "#/components/schemas/Favourite"

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    SearchResponse:
      type: object
      required: [total, page, size, results, facets, attribution]
      properties:
        total: { type: integer, description: "Total matching objects (exact up to 10,000)" }
        page: { type: integer }
        size: { type: integer }
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        facets:
          $ref: "#/components/schemas/Facets"
        attribution: { type: string }

    SearchResult:
      type: object
      required: [id, title, types, places, sourceUrl, retrievedAt]
      properties:
        id: { type: string }
        title: { type: string }
        types: { type: array, items: { type: string } }
        collection: { type: string }
        places: { type: array, items: { type: string } }
        dateLabel: { type: string }
        yearStart: { type: integer }
        yearEnd: { type: integer }
        thumbnail:
          $ref: "#/components/schemas/Image"
        highlight:
          type: string
          description: Matching snippet with matches wrapped in <mark></mark>
        sourceUrl: { type: string, description: The record on the Museum's website }
        retrievedAt: { type: string, format: date-time }

    Image:
      type: object
      required: [url, rightsTitle]
      properties:
        url: { type: string, description: Hotlinked from the Museum; never copied }
        rightsTitle: { type: string }
        rightsUrl: { type: string }

    Facets:
      type: object
      required: [types, places, decades, datedCount]
      properties:
        types: { type: array, items: { $ref: "#/components/schemas/FacetValue" } }
        places: { type: array, items: { $ref: "#/components/schemas/FacetValue" } }
        decades:
          type: array
          items:
            type: object
            required: [decade, count]
            properties:
              decade: { type: integer, example: 1910 }
              count: { type: integer }
        datedCount:
          type: integer
          description: How many matching objects have a date at all (most don't)

    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
