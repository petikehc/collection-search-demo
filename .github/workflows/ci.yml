# Checks every pull request and every push to main. Needs no AWS access: synth runs offline.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generated API types match openapi.yaml
        run: |
          pnpm generate:api
          git diff --exit-code -- functions/lib/api/types.gen.ts

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Synth, then check every Lambda bundle loads
        run: pnpm check:bundles
