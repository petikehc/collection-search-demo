# Weekly update PRs, each checked by CI. A release must be 14 days old before it's proposed, the
# same rule as minimumReleaseAge in pnpm-workspace.yaml: most hijacked releases are caught sooner.
# Security updates are separate and skip the wait. These PRs can't deploy: the deploy role trusts
# only main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib"]
      minor-and-patch:
        update-types: [minor, patch]
